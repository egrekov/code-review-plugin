name: Release plugin

# Публикация релиза: push тега vX.Y.Z ->
#   сборка ZIP -> GitHub Release -> updatePlugins.xml на GitHub Pages
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # создание Release
  pages: write      # публикация updatePlugins.xml
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # кэширует ~/.gradle, включая скачанный PhpStorm для сборки
      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: ver
        run: echo "version=$(cat .app_version)" >> "$GITHUB_OUTPUT"

      - name: Check tag matches .app_version
        if: github.ref_name != format('v{0}', steps.ver.outputs.version)
        run: |
          echo "Тег ${{ github.ref_name }} не соответствует версии в .app_version (${{ steps.ver.outputs.version }})"
          exit 1

      - name: Build and verify plugin
        run: >
          ./gradlew buildPlugin verifyPlugin
          -PpluginDownloadUrl="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/code-review-plugin-${{ steps.ver.outputs.version }}.zip"

      - name: Create GitHub Release with plugin ZIP
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/code-review-plugin-*.zip

      - name: Stage repository files
        run: |
          mkdir -p site
          cp build/distributions/updatePlugins.xml site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy updatePlugins.xml to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
